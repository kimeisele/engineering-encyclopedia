name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m compileall src
      - name: Unit tests
        run: python -m unittest discover
      - name: Corpus validation
        run: encyclopedia validate
      - name: Query smoke
        run: encyclopedia query "make sure this worker doesn't process the same job twice" --format json
