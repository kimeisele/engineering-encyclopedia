id: testing.coverage-limitations
version: 1
title: Coverage limitations
kind: principle
status: established

summary: >
  Coverage measures which lines a test suite exercises, not whether the
  behaviour is correct. High coverage can coexist with missing important
  paths, and 100 percent coverage proves nothing about the untested
  interactions between those lines.

intent_signals:
  - the tests don't cover everything
  - uncovered code paths
  - coverage percentage says nothing about quality
  - a test that passes does not prove correctness
  - 100% coverage can still miss important paths
  - untested edge cases fail in production

applies_when:
  - a coverage metric is used to judge a test suite
  - tests are being written or reviewed
  - a change to a tested line needs a test

does_not_apply_when:
  - coverage is used as a quick signal that tests ran at all

does_not_imply:
  - that untested code is wrong
  - that tested code is correct
  - that a high percentage is a quality target
  - that a passing suite detects regressions in behaviour

questions:
  - Which behaviours are asserted, not just which lines run?
  - What important paths are not covered at all?
  - Does the suite fail when the behaviour regresses?
  - Is the metric used as evidence of quality?

techniques:
  - behaviour-focused tests over line-focused tests
  - testing the failure and boundary paths explicitly
  - mutation testing to check the assertions
  - reviewing coverage for the paths that matter

risks:
  - treating coverage percentage as a target
  - deleting tests to raise the metric
  - tests that run code without asserting anything

tradeoffs:
  - technique: coverage-guided review of important paths
    benefit: directs attention where risk is
    cost: manual judgement, not a number
    choose_when: the suite must actually protect behaviour
  - technique: hard coverage thresholds in CI
    benefit: mechanical and enforceable
    cost: encourages padding, not quality
    choose_when: the team needs a minimal floor only

relations:
  related:
    - observability.error-context

contexts:
  languages: [any]
  project_types: [worker, cli, web-service, automation, library]
  lifecycle_stages: [implementation, review]

provenance:
  origin: curated
  rationale: >
    Coverage is routinely misread as a correctness measure; the node records
    the distinction and the failure modes of metric-driven testing observed
    in reviews.
  created_at: 2026-08-01
  last_verified_at: 2026-08-01
  verification_interval_days: 1095

keywords: [coverage, tests, code coverage, untested code, test quality]
