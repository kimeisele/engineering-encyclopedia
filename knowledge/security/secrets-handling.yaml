id: security.secrets-handling
version: 1
title: Secrets handling
kind: guideline
status: established

summary: >
  Secrets (keys, tokens, passwords) are injected at runtime from an
  environment or a vault. They never live in code, config files, client
  bundles, or logs, and they never have a committed default value.

intent_signals:
  - api key
  - password in code
  - secret in config
  - hardcoded token
  - credentials
  - load the secret
  - vault
  - leaked key

applies_when:
  - the code authenticates to any external system
  - credentials or tokens are needed at runtime
  - logs or error messages may include request context

does_not_apply_when:
  - a public read-only client with no secrets at all

does_not_imply:
  - that environment variables are encrypted
  - that authorization is now handled
  - that a secret file replaces rotation
  - that TLS protects a secret in a log

questions:
  - "Where does the secret come from at runtime: environment, vault, or a file?"
  - Is any placeholder or default value committed anywhere?
  - Can the secret reach a log, error message, or dump on any path?
  - Who can rotate it, and does rotation require a code change?

techniques:
  - inject via environment variables or a vault at process start
  - keep secret values out of every committed artifact
  - redact secrets in logs, errors and debug dumps
  - rotate without redeploying the code

risks:
  - hardcoded defaults that ship to every environment
  - logging the value on an error path
  - secrets in git history or client bundles
  - treating the presence of a secret as proof of security

tradeoffs:
  - technique: environment variables
    benefit: zero infrastructure
    cost: visible in process listings, no rotation lifecycle
    choose_when: a small deployment
  - technique: vault or secret manager
    benefit: rotation and audit
    cost: infrastructure and permissions to run
    choose_when: shared or long-lived credentials

relations:
  related:
    - observability.error-context
  requires_consideration_of:
    - security.authorization

contexts:
  languages: [any]
  project_types: [worker, web-service, cli, automation, library]
  lifecycle_stages: [design, implementation, review]

provenance:
  origin: curated
  rationale: >
    Credential leakage is a recurring failure class: defaults ship, error
    paths log the value, and rotation requires code changes. The questions
    force the source and the exposure paths to be named.
  created_at: 2026-08-02
  last_verified_at: 2026-08-02
  verification_interval_days: 1095

keywords: [secrets, api keys, tokens, credentials, vault, hardcoded passwords]
