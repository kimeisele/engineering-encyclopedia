[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-encyclopedia"
version = "0.1.0"
description = "Versioned engineering knowledge nodes that make coding-agent reasoning inspectable and provable."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kimeisele" }]
keywords = ["engineering", "coding-agents", "developer-tools", "knowledge-base", "python", "yaml"]
dependencies = ["PyYAML"]

[project.scripts]
encyclopedia = "encyclopedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
